; Service WORKER — scheduler + antrean. Tidak menerima trafik HTTP.
; scheduler menjalankan chain:index & transfers:index tiap menit dan
; settlement:keep harian; tanpa service ini explorer berhenti terindeks
; dan auto-refund/auto-selesai tidak pernah jalan.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:scheduler]
command=php /app/artisan schedule:work
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:queue]
; max-time: daur ulang proses tiap jam supaya kebocoran memori tidak menumpuk.
command=php /app/artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=3
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:config-check]
; Service worker memakai start command kustom yang MELEWATI entrypoint, jadi pemeriksaan
; rahasia (config:check) dijalankan di sini: sekali saat boot, lalu selesai. worker
; memegang salinan kunci privatnya sendiri (arbiter, pool, gas), terpisah dari web.
command=php /app/artisan config:check
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
