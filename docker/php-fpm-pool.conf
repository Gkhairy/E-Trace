; Pool php-fpm untuk service web. Dimuat SETELAH www.conf & zz-docker.conf bawaan
; image (urutan alfabetis), jadi nilai di sini yang berlaku.
[www]
; ondemand: proses PHP hanya dibuat saat ada request dan dimatikan setelah menganggur.
; Railway menagih RAM per menit dari pemakaian nyata, dan situs ini lebih banyak sepi
; daripada ramai, jadi proses yang standby terus (pm = dynamic) hanya membuang biaya.
; OPcache tinggal di proses master, jadi proses baru tetap memakai kode yang sudah
; ter-compile — hanya pembuatan prosesnya saja yang menambah beberapa milidetik.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
; Daur ulang proses secara berkala agar kebocoran memori tidak menumpuk.
pm.max_requests = 500
